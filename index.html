<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日々のおたすけ記録・改良版</title>
<style>
body{margin:0;background:#f7f7f4;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
main{max-width:560px;margin:auto;padding:24px 16px 40px}
h1{margin:0 0 4px;font-size:25px}.sub{color:#777;margin-bottom:18px}
.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #0000000d}
label{display:block;font-weight:700;margin-bottom:8px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:18px}
.row{display:flex;gap:9px;align-items:center}.row input{flex:1}
.total{min-width:125px;padding:12px;border-radius:10px;background:#f0f0ec;text-align:center;font-weight:700}
button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:10px;font-size:17px;font-weight:700;background:#333;color:white}
.saved{text-align:center;color:#4d7b58;min-height:24px;margin-top:10px}
.note{font-size:13px;color:#777;line-height:1.7}
.names{margin-top:10px}.name-row{display:flex;gap:8px;margin:7px 0;align-items:center}
.name-no{width:28px;font-weight:700;color:#777;text-align:center}
.name-row input{flex:1}
.empty{font-size:13px;color:#999;padding:4px 0}
.jinmyo-detail{margin-top:12px;padding-top:12px;border-top:1px solid #eee}
.jinmyo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jinmyo-grid label{font-size:14px;margin-bottom:6px}
.duration{margin-top:9px;padding:10px;border-radius:10px;background:#eef6f8;color:#456;text-align:center;font-weight:700}
@media(max-width:380px){.jinmyo-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>📖 日々のおたすけ記録</h1>
<div class="sub">改良版｜今日の御用と累計</div>

<div class="card">
<label for="date">日付</label>
<input id="date" type="date">
</div>

<div id="items"></div>

<div class="card">
<label>おさづけを取り次いだ方</label>
<div id="people" class="names"></div>
<div class="note">おさづけの回数を入力すると、その回数分だけ名前欄が自動で表示されます。</div>
</div>

<button onclick="save()">今日の記録を保存</button>
<div id="saved" class="saved"></div>

<div class="card note">
<b>十二下り（ておどり）</b><br>
十二下りのておどりをつとめ、他人の助かりを願う御用として記録します。
</div>
</main>

<script>
const items=[
["jinmyo","神名流し","回"],["leaflet","リーフレット配り","枚"],
["visit","戸別訪問","軒"],["otsutome","おつとめ","回"],
["junin","十二下り（ておどり）","回"],["osazuke","おさづけの取次ぎ","回"]
];

const box=document.getElementById("items");
items.forEach(([id,name,unit])=>{
if(id==="jinmyo"){
box.insertAdjacentHTML("beforeend",`
<div class="card">
<label>${name}（${unit}）</label>
<div class="row">
<input id="${id}" type="number" min="0" step="1" value="0" inputmode="numeric">
<div class="total">累計 <span id="${id}Total">0</span> ${unit}</div>
</div>
<div class="jinmyo-detail">
<div class="jinmyo-grid">
<div><label for="jinmyoStart">開始時刻</label><input id="jinmyoStart" type="time"></div>
<div><label for="jinmyoEnd">終了時刻</label><input id="jinmyoEnd" type="time"></div>
</div>
<div style="margin-top:10px"><label for="jinmyoPlace">場所</label><input id="jinmyoPlace" type="text" placeholder="例：○○町、駅前、車で移動中など"></div>
<div id="jinmyoDuration" class="duration">活動時間：未入力</div>
</div>
</div>`);
}else{
box.insertAdjacentHTML("beforeend",`
<div class="card">
<label>${name}（${unit}）</label>
<div class="row">
<input id="${id}" type="number" min="0" step="1" value="0" inputmode="numeric">
<div class="total">累計 <span id="${id}Total">0</span> ${unit}</div>
</div>
</div>`);
}
});

const d=new Date(),pad=n=>String(n).padStart(2,"0");
const date=document.getElementById("date");
date.value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

function dayKey(){return "otasuke_day_"+date.value}
function totalsKey(){return "otasuke_totals_v2"}
function peopleKey(){return "otasuke_people_"+date.value}

function syncPeople(){
const n=Math.max(0,Math.floor(Number(document.getElementById("osazuke").value)||0));
const box=document.getElementById("people");
const current=[...box.querySelectorAll("input")].map(x=>x.value);
box.innerHTML="";
if(n===0){
box.innerHTML='<div class="empty">今日はおさづけの取次ぎなし</div>';
return;
}
for(let i=0;i<n;i++){
const row=document.createElement("div");row.className="name-row";
const no=document.createElement("span");no.className="name-no";no.textContent=i+1;
const input=document.createElement("input");input.type="text";input.placeholder=`取り次いだ方 ${i+1}`;input.value=current[i]||"";
row.append(no,input);box.append(row);
}
}

function calcDuration(){
const start=document.getElementById("jinmyoStart").value;
const end=document.getElementById("jinmyoEnd").value;
const out=document.getElementById("jinmyoDuration");
if(!start||!end){out.textContent="活動時間：未入力";return "";}
let [sh,sm]=start.split(":").map(Number),[eh,em]=end.split(":").map(Number);
let mins=(eh*60+em)-(sh*60+sm);
if(mins<0) mins+=24*60;
const h=Math.floor(mins/60),m=mins%60;
out.textContent=`活動時間：${h?`${h}時間`:""}${m?`${m}分`:h?"":"0分"}`;
return mins;
}

function load(){
const day=JSON.parse(localStorage.getItem(dayKey())||"{}");
const totals=JSON.parse(localStorage.getItem(totalsKey())||"{}");
items.forEach(([id,,unit])=>{
document.getElementById(id).value=day[id]??0;
document.getElementById(id+"Total").textContent=totals[id]??0;
});
document.getElementById("jinmyoStart").value=day.jinmyoStart||"";
document.getElementById("jinmyoEnd").value=day.jinmyoEnd||"";
document.getElementById("jinmyoPlace").value=day.jinmyoPlace||"";
calcDuration();
syncPeople();
const names=Array.isArray(day.people)?day.people:[];
[...document.querySelectorAll("#people input")].forEach((el,i)=>el.value=names[i]||"");
document.getElementById("saved").textContent=day.saved?"保存済みです":"";
}

function save(){
const old=JSON.parse(localStorage.getItem(dayKey())||"{}");
const totals=JSON.parse(localStorage.getItem(totalsKey())||"{}");
const day={saved:true};

items.forEach(([id])=>{
const n=Math.max(0,Math.floor(Number(document.getElementById(id).value)||0));
totals[id]=(Number(totals[id])||0)-(Number(old[id])||0)+n;
day[id]=n;
});

day.jinmyoStart=document.getElementById("jinmyoStart").value;
day.jinmyoEnd=document.getElementById("jinmyoEnd").value;
day.jinmyoPlace=document.getElementById("jinmyoPlace").value.trim();
day.jinmyoDurationMinutes=calcDuration();

day.people=[...document.querySelectorAll("#people input")]
.map(x=>x.value.trim()).filter(Boolean);

localStorage.setItem(dayKey(),JSON.stringify(day));
localStorage.setItem(totalsKey(),JSON.stringify(totals));

items.forEach(([id,,unit])=>{
document.getElementById(id+"Total").textContent=totals[id]||0;
});
document.getElementById("saved").textContent="保存しました。今日もお疲れさまでした。";
}

document.getElementById("osazuke").addEventListener("input",syncPeople);
document.getElementById("jinmyoStart").addEventListener("change",calcDuration);
document.getElementById("jinmyoEnd").addEventListener("change",calcDuration);
date.addEventListener("change",load);
load();
</script>
</body>
</html>
